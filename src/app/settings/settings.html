<div class="child-container">
    <!-- Label Section -->
    <div>
        <app-label [text]="menuLabel"></app-label>
    </div>

<!-- pg-settings.component.html -->
<mat-card>
  <mat-tab-group [(selectedIndex)]="selectedTab">
    <mat-tab label="PG Profile">
      <div class="form-container">
        

        <form [formGroup]="pgProfileForm">
  <mat-form-field appearance="outline">
    <mat-label>PG Name</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>
</form>


        

        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contact</mat-label>
          <input matInput formControlName="contact">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Logo</mat-label>
          <input type="file" (change)="uploadLogo($event)">
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="saveForm('PG Profile')">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </mat-tab>

    <mat-tab label="Rent Rules">
      <div class="form-container">
        <mat-form-field appearance="outline">
          <mat-label>Due Date (day of month)</mat-label>
          <input matInput type="number" formControlName="dueDate">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Late Fee (₹)</mat-label>
          <input matInput type="number" formControlName="lateFee">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Deposit Policy</mat-label>
          <textarea matInput formControlName="depositPolicy"></textarea>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="saveForm('Rent Rules')">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </mat-tab>

    <mat-tab label="Payment Options">
      <div class="form-container">
        <mat-form-field appearance="outline">
          <mat-label>UPI ID</mat-label>
          <input matInput formControlName="upiId">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Bank Account</mat-label>
          <input matInput formControlName="bankAccount">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Enable QR</mat-label>
          <mat-select formControlName="enableQR">
            <mat-option [value]="true">Yes</mat-option>
            <mat-option [value]="false">No</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="saveForm('Payment Options')">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </mat-tab>

    <mat-tab label="Notifications">
      <div class="form-container">
        <mat-form-field appearance="outline">
          <mat-label>WhatsApp Template</mat-label>
          <textarea matInput formControlName="whatsappTemplate"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>SMS Template</mat-label>
          <textarea matInput formControlName="smsTemplate"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email Template</mat-label>
          <textarea matInput formControlName="emailTemplate"></textarea>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="saveForm('Notifications')">
          <mat-icon>save</mat-icon> Save
        </button>
      </div>
    </mat-tab>
  </mat-tab-group>

  <mat-card class="user-roles">
    <h3>User Roles</h3>
    <div *ngFor="let role of userRoles" class="role-card">
      <strong>{{ role.role }}</strong> - {{ role.description }}
    </div>
  </mat-card>
</mat-card>



</div>
