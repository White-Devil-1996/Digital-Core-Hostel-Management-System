<!-- Register Form -->
        <div id="registerForm" class="right" >
            <h2>Registration</h2>
            <div class="form-container">
                <div class="form-group">
                    <input type="text" placeholder="Username" />
                    <i class="fas fa-user"></i>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" />
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" />
                    <i class="fas fa-lock"></i>
                </div>
                <button class="primary">Register</button>
            </div>
            <p style="text-align:center; margin-top: 20px;">or register with social platforms</p>
            <div class="social-login">
                <button><i class="fab fa-google"></i></button>
                <button><i class="fab fa-facebook-f"></i></button>
                <button><i class="fab fa-github"></i></button>
                <button><i class="fab fa-linkedin-in"></i></button>
            </div>
        </div>
