<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">
    <!-- Show on LOGIN -->
    <div *ngIf="currentComponent === 'register'" class="fade show">
      <h2>Hello, Welcome!</h2>
      <p>Don't have an account?</p>
      <button (click)="showComponent('login')">Login</button>
    </div>

    <!-- Show on REGISTER -->
    <div *ngIf="currentComponent === 'login'" class="fade show">
      <h2>Welcome Back!</h2>
      <p>Already have an account?</p>
      <button (click)="showComponent('register')">Register</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <div *ngIf="currentComponent === 'login'" class="fade show">
      <input (blur)="colorPicker($event)" id="colorPicker" type="color" [value]="selectedColor" class="search-input">
      <app-login-form></app-login-form>
    </div>

    <div *ngIf="currentComponent === 'register'" class="fade show">
      <input (blur)="colorPicker($event)" id="colorPicker" type="color" [value]="selectedColor" class="search-input">
      <app-register-form></app-register-form>
    </div>
  </div>
</div>
