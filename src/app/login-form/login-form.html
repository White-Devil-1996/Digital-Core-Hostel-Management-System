<!-- Login Form -->
<div id="loginForm" class="right">
    <!-- <form [formGroup]="loginForms" (ngSubmit)="onSubmit()"> -->

    <form [formGroup]="loginForms" >
        <h2>Login</h2>
        <div class="form-container">

            <div class="form-group">
                <input type="text" id="Username" class="form-control" placeholder="Username"
                    formControlName="Username"
                    [ngClass]="{ 'is-invalid': loginForms.get('Username')?.touched && loginForms.get('Username')?.invalid }" />
                    <i class="fas fa-user"></i>
                
            </div>
            <div class="text-danger"
                    *ngIf="loginForms.get('Username')?.touched && loginForms.get('Username')?.hasError('required')">
                    Username is required
                </div>

            <div class="form-group">
                <input type="password" id="Password" class="form-control" placeholder="Password"
                    formControlName="Password"
                    [ngClass]="{ 'is-invalid': loginForms.get('Password')?.touched && loginForms.get('Password')?.invalid }" />
                    <i class="fas fa-lock"></i>
                
            </div>
            <div class="text-danger"
                    *ngIf="loginForms.get('Password')?.touched && loginForms.get('Password')?.hasError('required')">
                    Password is required
                </div>



            <div class="forgot" type="button" (click)="loginForm('ForgotPassword')">Forgot Password?</div>
            <button type="button" class="primary" (click)="loginForm('Login')">Login</button>
        </div>
        <p style="text-align:center; margin-top: 20px;">or login with social platforms</p>
        <div class="social-login">
            <button type="button" (click)="loginForm('google')"><i class="fab fa-google"></i></button>
            <button type="button" (click)="loginForm('facebook')"><i class="fab fa-facebook-f"></i></button>
            <button type="button" (click)="loginForm('github')"><i class="fab fa-github"></i></button>
            <button type="button" (click)="loginForm('linkedin')"><i class="fab fa-linkedin-in"></i></button>
        </div>
    </form>
</div>
